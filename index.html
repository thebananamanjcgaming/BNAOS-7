<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNAOS 7 | Signup</title>
    <link rel="stylesheet" href="https://unpkg.com/7.css/dist/7.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #0081C2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }
        .login-container {
            background: transparent;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }
        .profile-icon {
            display: block;
            margin: 0 auto 20px;
            width: 100px;
            height: 100px;
            border: 5px solid transparent;
            background-image: url('system32/border.png');
            background-size: cover;
            background-position: center;
            border-radius: 0;
            background-color: #fff;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            cursor: default;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #0078D7;
            color: black;
            border: none;
            border-radius: 5px;
            cursor: default;
        }
        button:hover {
            background-color: #0056A0;
        }
        footer {
            display: flex; /* Creates horizontal row */
            justify-content: center; /* Centers content */
            gap: 20px; /* Optional: adds space between items */
            padding: 10px;
            background-color: #f0f0f0;
        }
        footer p {
            margin: 0; /* Removes dividers/margins */
            text-decoration: none;
        }
    </style>
    <script>
        function toggleForm() {
            const form = document.querySelector('form');
            const title = document.querySelector('h1');
            if (form.dataset.mode === 'signup') {
                title.textContent = 'Login';
                form.dataset.mode = 'login';
                document.querySelector('button').textContent = 'Log In';
                document.title = 'BNAOS 7 | Login';
            } else {
                title.textContent = 'Signup';
                form.dataset.mode = 'signup';
                document.querySelector('button').textContent = 'Sign Up';
                document.title = 'BNAOS 7 | Signup';
            }
        }

        function handleSubmit(event) {
            event.preventDefault();
            const form = event.target;
            const username = form.querySelector('input[type="text"]').value;
            const password = form.querySelector('input[type="password"]').value;

            if (form.dataset.mode === 'signup') {
                localStorage.setItem(username, password);
                alert('User signed up successfully!');
                toggleForm();
            } else {
                const storedPassword = localStorage.getItem(username);
                if (storedPassword && storedPassword === password) {
                    alert('Login successful!');
                    window.location.replace('main.html');
                } else {
                    alert('Invalid username or password.');
                }
            }
        }
    </script>
</head>
<body>
    <div class="login-container">
        <img src="https://static.wikitide.net/windowswallpaperwiki/7/7b/User_%28Windows_7%29.png" alt="Profile Icon" class="profile-icon">
        <h1>Signup</h1>
        <form data-mode="signup" onsubmit="handleSubmit(event);">
            <input type="text" placeholder="Username" required>
            <input type="password" placeholder="Password" required>
            <button class="button primary" type="submit">Signup</button>
        </form>
        <button onclick="toggleForm(); this.remove();">Switch to Login</button>
    </div>
    <footer>
        <p>BNAOS 7 Professional</p>
        <img src="https://upload.wikimedia.org/wikipedia/pt/e/e0/Windows_logo.png" alt="Windows 7 Logo" style="width: 50px; height: auto;">
    </footer>
</body>
</html>
